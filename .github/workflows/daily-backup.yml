name: Daily SKM Backup

on:
  # Runs every day at midnight Singapore time (UTC+8 = 16:00 UTC)
  schedule:
    - cron: '0 16 * * *'

  # Also allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  backup:
    name: Export Neon → skm-backup repo
    runs-on: ubuntu-latest

    steps:
      - name: Trigger backup via Vercel API
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/backup" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")

          echo "HTTP status: $RESPONSE"
          echo "Response:"
          cat response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Backup failed with HTTP $RESPONSE"
            exit 1
          fi

          OK=$(cat response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok','false'))")
          if [ "$OK" != "True" ] && [ "$OK" != "true" ]; then
            echo "Backup API returned ok=false"
            cat response.json
            exit 1
          fi

          echo "Backup successful!"
          cat response.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('File:', d.get('file'))
          print('URL:', d.get('url'))
          counts = d.get('counts', {})
          for k, v in counts.items():
              print(f'  {k}: {v}')
          "
