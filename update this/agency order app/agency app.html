<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Desk — Agency Purchase Manager</title>
<meta name="description" content="Manage grocery shop supply agencies, their products, wholesale and retail prices, and build printable purchase orders." />
<style>
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef1ec; --ink:#16201a; --ink-soft:#5b6b60;
  --line:#dfe4dc; --brand:#1f6f4a; --brand-soft:#e6f1ea; --brand-ink:#0f3d28;
  --amber:#a3671a; --amber-soft:#fbf1e0; --danger:#a32020; --radius:14px;
  --shadow:0 1px 2px rgba(22,32,26,.06),0 8px 24px rgba(22,32,26,.06);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header.top{background:var(--brand);color:#fff;padding:18px 0;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(15,61,40,.18)}
header.top .wrap{padding-bottom:0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:.2px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.8;letter-spacing:.6px;text-transform:uppercase}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.ghost-light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.btn.ghost-light:hover{background:rgba(255,255,255,.22)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger);border-color:#eccaca;background:#fdf3f3}
.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:26px 0 18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft);font-weight:700}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:180px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
h2.section{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card .body{padding:16px 18px}
.card h3{margin:0 0 3px;font-size:17px}
.meta{color:var(--ink-soft);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand-ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.card .foot{border-top:1px solid var(--line);padding:11px 18px;display:flex;gap:8px;background:#fbfcfa;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:44px;text-align:center;color:var(--ink-soft);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft)}
td.num,th.num{text-align:right}
.qty{width:78px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.modal{position:fixed;inset:0;background:rgba(16,26,20,.45);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:60;overflow:auto}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:860px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.sheet header{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:18px}
.sheet .content{padding:20px 22px}
.sheet footer{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#fbfcfa;border-radius:0 0 16px 16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.totals{display:flex;justify-content:space-between;font-size:15px;padding:6px 0}
.totals.big{font-size:20px;font-weight:800;border-top:2px solid var(--ink);margin-top:8px;padding-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--brand);color:#fff}
.hint{font-size:12px;color:var(--ink-soft)}
.tag-day{font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:3px 9px;border-radius:999px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:90;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:620px){.top-actions{width:100%}.input{min-width:140px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="mark">◆</span><span>Stock Desk<small>Agency purchase manager</small></span></div>
    <div class="top-actions">
      <button class="btn ghost-light" id="btnExport">Backup</button>
      <button class="btn ghost-light" id="btnImport">Restore</button>
      <button class="btn ghost-light" id="btnAddAgency">+ New agency</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="field" style="flex:1;min-width:220px">
      <label for="search">Search</label>
      <input id="search" class="input" style="width:100%" placeholder="Agency, phone or product…" />
    </div>
    <div class="field">
      <label for="sortBy">Sort by</label>
      <select id="sortBy" class="input">
        <option value="name">Agency name (A–Z)</option>
        <option value="day">Visit day (Mon → Sun)</option>
        <option value="products">Most products</option>
        <option value="recent">Recently added</option>
      </select>
    </div>
    <div class="field">
      <label for="filterDay">Visit day</label>
      <select id="filterDay" class="input"><option value="">All days</option></select>
    </div>
  </div>
  <div id="agencyGrid" class="grid"></div>
</div>

<!-- Agency modal -->
<div class="modal" id="agencyModal"><div class="sheet" style="max-width:560px">
  <header><h3 id="agencyModalTitle">New agency</h3></header>
  <div class="content">
    <div class="row">
      <div class="field"><label>Agency name</label><input id="aName" class="input" placeholder="Sri Balaji Agencies" /></div>
      <div class="field"><label>Phone number</label><input id="aPhone" class="input" placeholder="98765 43210" /></div>
      <div class="field"><label>Visit day</label><select id="aDay" class="input"></select></div>
      <div class="field"><label>Contact person (optional)</label><input id="aPerson" class="input" placeholder="Ramesh" /></div>
    </div>
  </div>
  <footer><button class="btn" data-close>Cancel</button><button class="btn primary" id="aSave">Save agency</button></footer>
</div></div>

<!-- Products modal -->
<div class="modal" id="productModal"><div class="sheet">
  <header><h3 id="pTitle">Products</h3><span class="hint" id="pSub"></span></header>
  <div class="content">
    <div class="row" style="align-items:end">
      <div class="field"><label>Product</label><input id="pName" class="input" placeholder="Toor Dal 1kg" /></div>
      <div class="field"><label>Unit</label><input id="pUnit" class="input" placeholder="pkt / kg / box" /></div>
      <div class="field"><label>Wholesale ₹</label><input id="pWhole" type="number" min="0" step="0.01" class="input" /></div>
      <div class="field"><label>Retail ₹</label><input id="pRetail" type="number" min="0" step="0.01" class="input" /></div>
      <div class="field"><label>&nbsp;</label><button class="btn primary" id="pAdd">Add product</button></div>
    </div>
    <div style="margin-top:18px;overflow:auto"><table id="pTable"></table></div>
  </div>
  <footer><button class="btn" data-close>Done</button></footer>
</div></div>

<!-- Order modal -->
<div class="modal" id="orderModal"><div class="sheet">
  <header><h3 id="oTitle">Purchase list</h3>
    <div style="margin-left:auto" class="seg">
      <button data-price="wholesale" class="on">Wholesale</button><button data-price="retail">Retail</button>
    </div>
  </header>
  <div class="content">
    <div style="overflow:auto"><table id="oTable"></table></div>
    <div style="max-width:340px;margin-left:auto;margin-top:16px">
      <div class="totals"><span>Items selected</span><strong id="oCount">0</strong></div>
      <div class="totals"><span>Total quantity</span><strong id="oQty">0</strong></div>
      <div class="totals big"><span>Total</span><span id="oTotal">₹0.00</span></div>
    </div>
  </div>
  <footer>
    <button class="btn" data-close>Close</button>
    <button class="btn" id="oClear">Clear</button>
    <button class="btn" id="oImage">Save / share image</button>
    <button class="btn" id="oThermal">Thermal print</button>
    <button class="btn primary" id="oPrint">Print A4</button>
  </footer>
</div></div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="application/json" hidden />

<script>
(function(){
"use strict";
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday","Not fixed"];
const KEY="stockdesk.v1";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const money=n=>"₹"+(Number(n)||0).toFixed(2);
let state=load(), ui={agencyId:null,mode:"wholesale",cart:{}};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.agencies))return d;}catch(e){}
 return {agencies:[],shop:"My Grocery Shop"};}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function agency(id){return state.agencies.find(a=>a.id===id);}
function openM(id){$(id).classList.add("open");}
function closeM(el){el.classList.remove("open");}
document.addEventListener("click",e=>{if(e.target.matches("[data-close]"))closeM(e.target.closest(".modal"));
 if(e.target.classList.contains("modal"))closeM(e.target);});

/* ---------- day selects ---------- */
DAYS.forEach(d=>{
  $("#aDay").insertAdjacentHTML("beforeend",`<option>${d}</option>`);
  $("#filterDay").insertAdjacentHTML("beforeend",`<option>${d}</option>`);
});

/* ---------- home list ---------- */
function renderHome(){
  const q=$("#search").value.trim().toLowerCase(), day=$("#filterDay").value, sort=$("#sortBy").value;
  let list=state.agencies.filter(a=>{
    if(day&&a.day!==day)return false;
    if(!q)return true;
    return (a.name+" "+a.phone+" "+(a.person||"")).toLowerCase().includes(q)||a.products.some(p=>p.name.toLowerCase().includes(q));
  });
  list.sort((a,b)=>{
    if(sort==="name")return a.name.localeCompare(b.name);
    if(sort==="day")return DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||a.name.localeCompare(b.name);
    if(sort==="products")return b.products.length-a.products.length;
    return (b.created||0)-(a.created||0);
  });
  const g=$("#agencyGrid");
  if(!list.length){g.innerHTML=`<div class="empty" style="grid-column:1/-1"><h3 style="margin:0 0 6px">No agencies yet</h3><p style="margin:0 0 16px">Add the agencies that visit your shop, then list their products with wholesale and retail prices.</p><button class="btn primary" onclick="document.getElementById('btnAddAgency').click()">+ Add your first agency</button></div>`;return;}
  g.innerHTML=list.map(a=>{
    const ws=a.products.length?Math.min(...a.products.map(p=>+p.wholesale||0)):0;
    return `<article class="card"><div class="body">
      <h3>${esc(a.name)}</h3>
      <div class="meta"><span class="tag-day">${esc(a.day)}</span><span class="pill">${a.products.length} products</span></div>
      <div class="meta"><span>Ph: ${esc(a.phone||"—")}</span>${a.person?`<span>Contact: ${esc(a.person)}</span>`:""}</div>
      ${a.products.length?`<div class="meta"><span>From ${money(ws)} wholesale</span></div>`:""}
    </div>
    <div class="foot">
      <button class="btn sm primary" data-order="${a.id}">Make list</button>
      <button class="btn sm" data-products="${a.id}">Products</button>
      <button class="btn sm" data-edit="${a.id}">Edit</button>
      <button class="btn sm danger" data-del="${a.id}">Delete</button>
    </div></article>`;
  }).join("");
}
["input","change"].forEach(ev=>{$("#search").addEventListener(ev,renderHome);});
$("#sortBy").onchange=renderHome; $("#filterDay").onchange=renderHome;

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.order)openOrder(b.dataset.order);
  if(b.dataset.products)openProducts(b.dataset.products);
  if(b.dataset.edit)openAgency(b.dataset.edit);
  if(b.dataset.del){const a=agency(b.dataset.del);
    if(confirm(`Delete "${a.name}" and its ${a.products.length} products?`)){state.agencies=state.agencies.filter(x=>x.id!==a.id);save();renderHome();toast("Agency deleted");}}
});

/* ---------- agency form ---------- */
let editingId=null;
function openAgency(id){
  editingId=id||null;const a=id?agency(id):null;
  $("#agencyModalTitle").textContent=a?"Edit agency":"New agency";
  $("#aName").value=a?a.name:"";$("#aPhone").value=a?a.phone:"";$("#aPerson").value=a?(a.person||""):"";
  $("#aDay").value=a?a.day:"Monday";openM("#agencyModal");$("#aName").focus();
}
$("#btnAddAgency").onclick=()=>openAgency(null);
$("#aSave").onclick=()=>{
  const name=$("#aName").value.trim();if(!name)return toast("Agency name is required");
  const data={name,phone:$("#aPhone").value.trim(),person:$("#aPerson").value.trim(),day:$("#aDay").value};
  if(editingId)Object.assign(agency(editingId),data);
  else state.agencies.push({id:uid(),created:Date.now(),products:[],...data});
  save();closeM($("#agencyModal"));renderHome();toast("Saved");
};

/* ---------- products ---------- */
function openProducts(id){
  ui.agencyId=id;const a=agency(id);
  $("#pTitle").textContent=a.name+" — products";
  $("#pSub").textContent=a.day+" • "+(a.phone||"no phone");
  renderProducts();openM("#productModal");
}
function renderProducts(){
  const a=agency(ui.agencyId);
  $("#pTable").innerHTML=`<thead><tr><th>Product</th><th>Unit</th><th class="num">Wholesale</th><th class="num">Retail</th><th class="num">Margin</th><th></th></tr></thead><tbody>`+
  (a.products.length?a.products.map(p=>`<tr>
    <td>${esc(p.name)}</td><td>${esc(p.unit||"—")}</td>
    <td class="num">${money(p.wholesale)}</td><td class="num">${money(p.retail)}</td>
    <td class="num">${money((+p.retail||0)-(+p.wholesale||0))}</td>
    <td class="num"><button class="btn sm danger" data-pdel="${p.id}">Remove</button></td></tr>`).join("")
   :`<tr><td colspan="6" style="color:#5b6b60;padding:22px 8px">No products listed for this agency yet.</td></tr>`)+`</tbody>`;
}
$("#pAdd").onclick=()=>{
  const name=$("#pName").value.trim();if(!name)return toast("Product name is required");
  agency(ui.agencyId).products.push({id:uid(),name,unit:$("#pUnit").value.trim(),wholesale:+$("#pWhole").value||0,retail:+$("#pRetail").value||0});
  save();["#pName","#pUnit","#pWhole","#pRetail"].forEach(s=>$(s).value="");$("#pName").focus();renderProducts();renderHome();
};
$("#pTable").addEventListener("click",e=>{
  const id=e.target.dataset&&e.target.dataset.pdel;if(!id)return;
  const a=agency(ui.agencyId);a.products=a.products.filter(p=>p.id!==id);save();renderProducts();renderHome();
});

/* ---------- order / cart ---------- */
function openOrder(id){
  ui.agencyId=id;ui.cart={};ui.mode="wholesale";
  document.querySelectorAll("#orderModal .seg button").forEach(b=>b.classList.toggle("on",b.dataset.price==="wholesale"));
  const a=agency(id);$("#oTitle").textContent=a.name+" — purchase list";
  renderOrder();openM("#orderModal");
}
document.querySelectorAll("#orderModal .seg button").forEach(b=>b.onclick=()=>{
  ui.mode=b.dataset.price;document.querySelectorAll("#orderModal .seg button").forEach(x=>x.classList.toggle("on",x===b));renderOrder();
});
function price(p){return +(ui.mode==="retail"?p.retail:p.wholesale)||0;}
function renderOrder(){
  const a=agency(ui.agencyId);
  $("#oTable").innerHTML=`<thead><tr><th>Product</th><th>Unit</th><th class="num">Rate</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>`+
  (a.products.length?a.products.map(p=>{
    const q=ui.cart[p.id]||0;
    return `<tr><td>${esc(p.name)}</td><td>${esc(p.unit||"—")}</td><td class="num">${money(price(p))}</td>
    <td class="num"><input class="qty" type="number" min="0" step="0.5" value="${q||""}" placeholder="0" data-q="${p.id}"></td>
    <td class="num">${q?money(q*price(p)):"—"}</td></tr>`;}).join("")
   :`<tr><td colspan="5" style="padding:22px 8px;color:#5b6b60">Add products to this agency first.</td></tr>`)+`</tbody>`;
  const lines=cartLines();
  $("#oCount").textContent=lines.length;
  $("#oQty").textContent=lines.reduce((s,l)=>s+l.qty,0);
  $("#oTotal").textContent=money(lines.reduce((s,l)=>s+l.amount,0));
}
$("#oTable").addEventListener("input",e=>{
  const id=e.target.dataset.q;if(!id)return;
  const v=parseFloat(e.target.value);if(!v||v<=0)delete ui.cart[id];else ui.cart[id]=v;
  const lines=cartLines();
  $("#oCount").textContent=lines.length;$("#oQty").textContent=lines.reduce((s,l)=>s+l.qty,0);
  $("#oTotal").textContent=money(lines.reduce((s,l)=>s+l.amount,0));
  const row=e.target.closest("tr");row.lastElementChild.textContent=v>0?money(v*price(agency(ui.agencyId).products.find(p=>p.id===id))):"—";
});
$("#oClear").onclick=()=>{ui.cart={};renderOrder();};
function cartLines(){
  const a=agency(ui.agencyId);
  return a.products.filter(p=>ui.cart[p.id]>0).map(p=>({name:p.name,unit:p.unit||"",rate:price(p),qty:ui.cart[p.id],amount:ui.cart[p.id]*price(p)}));
}
function orderData(){
  const a=agency(ui.agencyId),lines=cartLines();
  return {agency:a,lines,total:lines.reduce((s,l)=>s+l.amount,0),qty:lines.reduce((s,l)=>s+l.qty,0),
    date:new Date().toLocaleString(),mode:ui.mode==="retail"?"Retail rates":"Wholesale rates"};
}

/* ---------- printing ---------- */
function printHTML(html){
  const w=window.open("","_blank","width=420,height=700");
  if(!w)return toast("Allow pop-ups to print");
  w.document.write(html);w.document.close();w.focus();
  setTimeout(()=>{w.print();},350);
}
function a4(d){
  return `<!doctype html><html><head><meta charset="utf-8"><title>Purchase list - ${esc(d.agency.name)}</title><style>
  body{font-family:${"'Segoe UI',system-ui,Arial,sans-serif"};margin:32px;color:#16201a}
  h1{margin:0 0 4px;font-size:22px}.sub{color:#5b6b60;font-size:13px}
  table{width:100%;border-collapse:collapse;margin-top:22px}
  th,td{border-bottom:1px solid #ddd;padding:9px 6px;font-size:13px;text-align:left}
  th{background:#f1f4f0;text-transform:uppercase;font-size:11px;letter-spacing:.6px}
  .num{text-align:right}tfoot td{font-weight:700;font-size:15px;border-top:2px solid #16201a}
  .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1f6f4a;padding-bottom:12px}
  </style></head><body>
  <div class="hd"><div><h1>${esc(d.agency.name)}</h1>
  <div class="sub">${esc(d.agency.day)} • ${esc(d.agency.phone||"")}${d.agency.person?" • "+esc(d.agency.person):""}</div></div>
  <div class="sub" style="text-align:right">Purchase list<br>${esc(d.date)}<br>${esc(d.mode)}</div></div>
  <table><thead><tr><th>#</th><th>Product</th><th>Unit</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>
  ${d.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td><td>${esc(l.unit)}</td><td class="num">${l.qty}</td><td class="num">${l.rate.toFixed(2)}</td><td class="num">${l.amount.toFixed(2)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td colspan="3">Total</td><td class="num">${d.qty}</td><td></td><td class="num">${d.total.toFixed(2)}</td></tr></tfoot></table>
  <p class="sub" style="margin-top:34px">Signature: ______________________</p></body></html>`;
}
function thermal(d,width){
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.agency.name)}</title><style>
  @page{size:${width}mm auto;margin:3mm}
  body{width:${width-6}mm;margin:0;font-family:"Courier New",monospace;font-size:11px;color:#000}
  h1{font-size:14px;margin:0;text-align:center}.c{text-align:center}
  hr{border:0;border-top:1px dashed #000;margin:6px 0}
  table{width:100%;border-collapse:collapse}td{padding:1px 0;vertical-align:top;font-size:11px}
  .r{text-align:right}.b{font-weight:700}
  </style></head><body>
  <h1>${esc(d.agency.name)}</h1>
  <div class="c">${esc(d.agency.phone||"")}</div>
  <div class="c">${esc(d.agency.day)} • ${esc(d.mode)}</div>
  <div class="c">${esc(d.date)}</div><hr>
  <table>${d.lines.map(l=>`<tr><td colspan="2">${esc(l.name)}</td></tr>
  <tr><td>${l.qty} ${esc(l.unit)} x ${l.rate.toFixed(2)}</td><td class="r">${l.amount.toFixed(2)}</td></tr>`).join("")}</table>

}
$("#oPrint").onclick=()=>{const d=orderData();if(!d.lines.length)return toast("Select at least one product");printHTML(a4(d));};
$("#oThermal").onclick=()=>{
  const d=orderData();if(!d.lines.length)return toast("Select at least one product");
  const w=prompt("Thermal paper width in mm (58 or 80)?","80");if(!w)return;
  printHTML(thermal(d,Math.max(40,parseInt(w,10)||80)));
};

/* ---------- image share ---------- */
function buildImage(d){
  const W=760,pad=36,rowH=34,head=190,foot=150;
  const c=document.createElement("canvas");
  const dpr=2;c.width=W*dpr;c.height=(head+d.lines.length*rowH+foot)*dpr;
  const x=c.getContext("2d");x.scale(dpr,dpr);const H=c.height/dpr;
  x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
  x.fillStyle="#1f6f4a";x.fillRect(0,0,W,108);
  x.fillStyle="#fff";x.font="700 26px Segoe UI, Arial";x.fillText(d.agency.name.slice(0,34),pad,50);
  x.font="14px Segoe UI, Arial";x.fillStyle="rgba(255,255,255,.85)";
  x.fillText(`${d.agency.day}  •  ${d.agency.phone||""}`,pad,76);
  x.textAlign="right";x.fillText(d.mode,W-pad,50);x.fillText(d.date,W-pad,76);x.textAlign="left";
  let y=head-42;
  x.fillStyle="#5b6b60";x.font="700 12px Segoe UI, Arial";
  x.fillText("PRODUCT",pad,y);x.textAlign="right";x.fillText("QTY",W-330,y);x.fillText("RATE",W-190,y);x.fillText("AMOUNT",W-pad,y);x.textAlign="left";
  y+=12;x.strokeStyle="#dfe4dc";x.beginPath();x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke();
  y+=26;
  d.lines.forEach((l,i)=>{
    if(i%2){x.fillStyle="#f6f8f5";x.fillRect(pad-8,y-20,W-2*pad+16,rowH-4);}
    x.fillStyle="#16201a";x.font="15px Segoe UI, Arial";x.fillText(l.name.slice(0,36),pad,y);
    x.textAlign="right";x.fillStyle="#16201a";
    x.fillText(String(l.qty)+" "+(l.unit||""),W-330,y);
    x.fillText(l.rate.toFixed(2),W-190,y);
    x.font="700 15px Segoe UI, Arial";x.fillText(l.amount.toFixed(2),W-pad,y);x.textAlign="left";
    y+=rowH;
  });
  y+=6;x.strokeStyle="#16201a";x.lineWidth=2;x.beginPath();x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke();
  y+=34;x.fillStyle="#16201a";x.font="700 20px Segoe UI, Arial";x.fillText("Total",pad,y);
  x.textAlign="right";x.fillText("₹"+d.total.toFixed(2),W-pad,y);
  x.font="14px Segoe UI, Arial";x.fillStyle="#5b6b60";y+=26;
  x.fillText(`${d.lines.length} items  •  ${d.qty} units`,W-pad,y);x.textAlign="left";
  return c;
}
$("#oImage").onclick=async()=>{
  const d=orderData();if(!d.lines.length)return toast("Select at least one product");
  const canvas=buildImage(d);
  canvas.toBlob(async blob=>{
    const file=new File([blob],`${d.agency.name.replace(/\W+/g,"-")}-list.png`,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:d.agency.name,text:"Purchase list"});return;}catch(e){}
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Image saved to downloads");
  },"image/png");
};

/* ---------- backup ---------- */
$("#btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="stock-desk-backup.json";a.click();toast("Backup downloaded");
};
$("#btnImport").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.agencies))throw 0;state=d;save();renderHome();toast("Data restored");}catch(err){toast("That file could not be read");}};
  r.readAsText(f);e.target.value="";
};

renderHome();
})();
</script>
